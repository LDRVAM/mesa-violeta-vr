<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa Violeta</title>

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
</head>
<body>
    <a-scene device-orientation-permission-ui="enabled: false">
        <a-sky  id="sky" src="#point1" rotation="0 -80 0"></a-sky> 
        <a-assets>
            <!--Recorrido hacia la entrada-->
            <img id="point1" src="images/GS__01_DxO.webp" alt="Imagen 1">

            <img id="point2" src="images/GS__03_DxO.webp" alt="Imagen 2">

            <img id="juridicaArea" src="images/juridica.png" alt="juridica">
            <img id="psicoArea" src="images/psico.png" alt="psicologia">
            <img id="ludicaArea" src="images/ludica.png" alt="ludica">
            <img id="socialArea" src="images/social.png" alt="social">
            
            <img id="point3" src="images/GS__05_DxO.webp" alt="Imagen 3">
           
            <!--Recepción-->
            <img id="point4" src="images/GS__07_DxO.webp" alt="Imagen 4">
            <img id="point7" src="images/GS__10_DxO.webp" alt="Imagen 7">

            <!-- Violentometro y juguetes -->
            <img id="point9" src="images/GS__14_DxO.webp" alt="Imagen 9">
            <img id="point10" src="images/GS__15_DxO.webp" alt="Imagen 10">

            <img id="point11" src="images/GS__16_DxO.webp" alt="Imagen 11">

            <!--Recursos-->
            <img id="close1" src="images/close1.png" alt="close1">
            <video id="atras" autoplay loop muted src="images/direction.webm" alt="hotspot"></video>
            <video id="adelante" autoplay loop muted src="images/adelante.webm" alt="adelante"></video>
            <video id="video" autoplay loop muted src="images/try.webm"></video>
            <img id="imgP" src="images/imgPrueba.jpg" alt="imgPrueba">

            <img id="imgPsicologica" src="images/violencia-psico.png" alt="imgPsicologica">
            <img id="imgFisica" src="images/violencia-fisica.png" alt="imgFisica">
            <img id="imgPatrimonial" src="images/violencia-patrimonial.png" alt="imgPatrimonial">
            <img id="imgEconomica" src="images/violencia-economica.png" alt="imgEconomica">
            <img id="imgSexual" src="images/violencia-sexual.png" alt="imgSexual">

        </a-assets>

        <a-entity id="spots" hotspots scale="1 1 1">
            <!--Estacionamiento-->
            <a-entity id="group-point1">
                <a-video class="adelante" spot="linkto:#point2;spotgroup:group-point2" position="0 0.2 -2.5" rotation="90 60 -35" material="opacity:0.9" src="#adelante" geometry="width: 1.8; height: 1.3" look-at="#cam"></a-video>
            </a-entity>

            <a-entity id="group-point2" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point1;spotgroup:group-point1" position="0.5 0.5 5" rotation="90 60 140" src="#atras" material="opacity=0.8" geometry="width:2; height: 1.3" look-at="#cam"></a-image>
                <a-image class="adelante" spot="linkto:#point3;spotgroup:group-point3" position="-3.5 0.5 -2.5" rotation="90 60 -105" src="#adelante" material="opacity:0.8" geometry="width:2; height:1.3" look-at="#cam"></a-image>
                
                <a-video id="open" position="1 -0.5 -5" rotation="85 180 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open; imageId: psicologica; closeId: close" geometry="width: 2.2; height: 2.2"></a-video>
                <a-entity id="psicologica" position="2.5 1 -9" rotation="0.000 -10 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 8.3" material="color: #FFF200; opacity: 0.7"></a-plane>
                    <a-image src="#imgPsicologica" position="0 2.8 0.03" geometry="width: 7; height: 4" material=""></a-image>
                    <a-circle position="3.12 4.3 0.05" id="close" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 0.3 0.01" value="Es cualquier acto u omisión que dañe la estabilidad psicológica, que puede consistir en: negligencia, abandono, descuido reiterado, celotipia, insultos, humillaciones, devaluación, marginación, indiferencia, infidelidad, comparaciones destructivas, rechazo, restricción a la autodeterminación y amenazas, las cuales conllevan a la víctima a la depresión, al aislamiento, a la devaluación de su autoestima e incluso al suicidio." align="center" color="black" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open1" position="4 -1 -1.5" rotation="90 120 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open1; imageId: fisica; closeId: close1" geometry="width: 2.6; height: 2.6"></a-video>
                <a-entity id="fisica" position="8 1 -2" rotation="0.000 -70 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.3; height: 6.8" material="color: #FFA500; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close1" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgFisica" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 -0.1 0.01" value="Es cualquier acto que inflige daño no accidental, usando la fuerza física o algún tipo de arma u objeto que pueda provocar o no lesiones ya sean internas, externas, o ambas" align="center" color="black" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open2" position="4.5 -1 5" rotation="75 20 10" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open2; imageId: patrimonial; closeId: close2" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="patrimonial" position="7 1 6.5" rotation="0.000 -130 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 8.3" material="color: #FF7F00; opacity: 0.7"></a-plane>
                    <a-circle position="3.12 4.3 0.05" id="close2" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgPatrimonial" position="0 2.8 0.03" geometry="width: 7; height: 4" material=""></a-image>
                    <a-text position="0 0.3 0.01" value="Es cualquier acto u omisión que afecta la supervivencia de la víctima. Se manifiesta en: la transformación, sustracción, destrucción, retención o distracción de objetos, documentos personales, bienes y valores, derechos patrimoniales o recursos económicos destinados a satisfacer sus necesidades y puede abarcar los daños a los bienes comunes o propios de la víctima." align="center" color="black" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open3" position="-4 -1 4.5" rotation="80 -30 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open3; imageId: economica; closeId: close3" geometry="width: 2.7; height: 2.7"></a-video>
                <a-entity id="economica" position="-4.5 1 8" rotation="0.000 -220 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 6.8" material="color: #E63946; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close3" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgEconomica" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 0 0.01" value="Es toda acción u omisión del Agresor que afecta la supervivencia económica de la víctima. Se manifiesta a través de limitaciones encaminadas a controlar el ingreso de sus percepciones económicas, así como la percepción de un salario menor por igual trabajo, dentro de un mismo centro laboral" align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open4" position="-6 -1 0" rotation="80 -70 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open4; imageId: sexual; closeId: close4" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="sexual" position="-8.5 1 0" rotation="0.000 90 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 6.8" material="color: #B30000; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close4" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgSexual" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 -0.1 0.01" value="Es cualquier acto que degrada o daña el cuerpo y/o la sexualidad de la Víctima y que por tanto atenta contra su libertad, dignidad e integridad física. Es una expresión de abuso de poder que implica la supremacía masculina sobre la mujer, al denigrarla y concebirla como objeto." align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

            </a-entity>

            <a-entity id="group-point3" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point2;spotgroup:group-point2" position="0.5 -0.9 3" rotation="90 60 142" src="#atras" material="opacity:0.8" geometry="width:1.8; height: 1.3" look-at="#cam"></a-image>
                <a-image class="adelante" spot="linkto:#point4;spotgroup:group-point4" position="-0.8 -0.7 -3.5" rotation="90 60 -40" src="#adelante" material="opacity:0.8" geometry="width:2 ; height:1.3" look-at="#cam"></a-image>   
                
                <a-video id="open5" position="3.7 -1 -3" rotation="90 120 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open5; imageId: familiar; closeId: close5" geometry="width: 2.6; height: 2.6"></a-video>
                <a-entity id="familiar" position="6 1 -5" rotation="0.000 -60 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.3; height: 6.8" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close5" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgFisica" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 -0.1 0.01" value="La violencia familiar es el uso de la fuerza física o psicológica para controlar, manipular o agredir a un miembro de la familia. Puede ser física, sexual, psicológica, económica o patrimonial" align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open6" position="5.3 -1 2.5" rotation="75 20 10" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open6; imageId: laboral; closeId: close6" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="laboral" position="7 1 4" rotation="0.000 -110 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.3; height: 6.8" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.5 0.05" id="close6" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgPatrimonial" position="0 2.1 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 -0.2 0.01" value="La violencia laboral es un abuso de poder que se ejerce en el ámbito laboral, ya sea de forma física, verbal, psicológica o sexual. Puede ocurrir entre compañeros o entre un superior y un subordinado." align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open7" position="-4.3 -1 4" rotation="80 -30 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open7; imageId: docente; closeId: close7" geometry="width: 2.7; height: 2.7"></a-video>
                <a-entity id="docente" position="-4.5 1 6" rotation="0.000 -220 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 6.8" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close7" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgEconomica" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 0 0.01" value="Aquellas conductas que dañen la autoestima de las alumnas con actos de discriminación por su sexo, edad, condición social, académica, limitaciones y/o características físicas, que les infligen maestras o maestros." align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open8" position="-5.3 -1 -2" rotation="80 -70 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open8; imageId: comunitaria; closeId: close8" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="comunitaria" position="-8 1 -2" rotation="0.000 80 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 7.5; height: 6.8" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="3 3.8 0.05" id="close8" radius="0.35" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#imgSexual" position="0 2.3 0.03" geometry="width: 6.8; height: 3.7" material=""></a-image>
                    <a-text position="0 -0.1 0.01" value="La violencia comunitaria es un conjunto de actos de violencia que ocurren en espacios públicos, cometidos por personas que no están relacionadas entre sí. Puede ser individual o colectiva." align="center" color="white" width="7.2" text="wrapCount: 42; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

            </a-entity>

            <!--Recepcion-->
            <a-entity id="group-point4" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point3;spotgroup:group-point3" position="-6 -5 6" rotation="-80 80 170" src="#atras" material="opacity=0.8" geometry="width:3.5; height:3.5" look-at="#cam"></a-image>
                
                <a-image class="adelante" spot="linkto:#point7;spotgroup:group-point7" position="9 -4 1.5" rotation="80 50 55" src="#adelante" material="opacity=0.8" geometry="width:3; height:3" look-at="#cam"></a-image> 
            </a-entity>

            <a-entity id="group-point7" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point6;spotgroup:group-point6" position="3 -3 -4" rotation="80 170 100" src="#atras" material="opacity=0.8" geometry="width:2.5; height:2.5" look-at="#cam"></a-image>
                <a-image class="adelante" spot="linkto:#point9;spotgroup:group-point9" position="-3.2 -0.8 7.7" rotation="90 50 130" src="#adelante" material="opacity=0.8" geometry="width:2; height:2" look-at="#cam"></a-image> 
            </a-entity>
           
            <!--Violentometro y juguetes-->
            <a-entity id="group-point9" scale="0 0 0">
                <a-image class="adelante" spot="linkto:#point10;spotgroup:group-point10" position="-1 -1.8 -5" rotation="90 -170 90" src="#adelante" material="opacity=0.8" geometry="width:2.6; height:1.7" look-at="#cam"></a-image>
                <a-image class="adelante" spot="linkto:#point11;spotgroup:group-point11" position="5 -1.8 2" rotation="90 60 90" src="#adelante" material="opacity=0.8" geometry="width:3; height:1.5" look-at="#cam"></a-image>
                <a-image class="atras" spot="linkto:#point7;spotgroup:group-point7" position="-10 -3 1" rotation="80 -75 100" src="#atras" material="opacity=0.8" geometry="width:2.5; height:2.5" look-at="#cam"></a-image>
            </a-entity>

            <a-entity id="group-point10" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point9;spotgroup:group-point9" position="3 -1 9" rotation="80 22 90" src="#atras" material="opacity=0.8" geometry="width:2; height:2" look-at="#cam"></a-image>
            </a-entity>

            <a-entity id="group-point11" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point9;spotgroup:group-point9" position="9 -2 6" rotation="90 10 90" src="#atras" material="opacity=0.8" geometry="width:2.5; height:2.5" look-at="#cam"></a-image>

                <a-video id="open16" position="-6 -2.2 0.5" rotation="90 150 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open16; imageId: ludica; closeId: close16" geometry="width: 2.7; height: 2.7"></a-video>
                <a-entity id="ludica" position="-11 0.5 0.5" rotation="0.000 90 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 10" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4 5.3 0.04" id="close16" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-image src="#ludicaArea" position="0 3.3 0.03" geometry="width: 9.2; height: 5" material=""></a-image>
                    <a-text position="0 0 0.01" value="Área lúdica" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 -1 0.01" value="El Área Lúdica del Centro de Justicia de la Mujer (CJM) ofrece un espacio seguro para que los hijos de las usuarias permanezcan mientras ellas reciben atención. A través de actividades de juego, psicólogas y especialistas en educación pueden detectar posibles afectaciones por violencia y determinar si necesitan atención especializada." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>
            </a-entity>


        </a-entity>


        <a-entity id="cam" camera position="0 1.6 0" look-controls>
            <a-entity 
                cursor="fuse: true; fuseTimeout:2000"
                geometry="primitive:ring;radiusInner:0.01;radiusOuter:0.02"
                position="0 0 -1.8"
                material="shader:flat;color:#ff0000;">
            </a-entity>

            <a-entity 
            cursor="rayOrigin: mouse"
            raycaster="objects: .interactivo"
            geometry="primitive:ring; radiusInner:0.01; radiusOuter:0.02"
            position="0 0 -1.8"
            material="shader:flat; color:#ff0000;">
        </a-entity>

        <a-entity position="-2 0.30 -1.5">
            <a-image class="logo" src="./images/LaPaz-logo1.png" position="0.75 0.30 -1.5" width="0.35" height="0.35"  material="" geometry=""></a-image>
        </a-entity>
        </a-entity>
    </a-scene>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras/dist/aframe-extras.min.js"></script>

    <script src="js/hotspot.js"></script>
</body>
</html>
