        <a-entity id="spots" hotspots scale="1 1 1">
            <!--Estacionamiento-->
            <a-entity id="group-point1">
                <a-video class="adelante" spot="linkto:#point2;spotgroup:group-point2" position="0 0.2 -2.5" rotation="90 60 -35" material="opacity:0.9" src="#adelante" geometry="width: 1.8; height: 1.3" look-at="#cam"></a-video>

                <a-video id="open" position="4 -0.2 -8" rotation="20 -30 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open; imageId: trabajoSocial; closeId: close1" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="trabajoSocial" position="7 0.5 -12" rotation="0.000 -10 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6" material="color: #FFF9B1; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close1" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.5 0.01" value="Área de trabajo social" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.2 0.01" value="Las trabajadoras sociales dan seguimiento a los casos para asegurar que las víctimas de violencia completen trámites, continúen estudios, accedan a empleo y terminen terapias. Dado que enfrentan factores externos que pueden hacerlas abandonar el proceso, es clave mantener contacto mediante llamadas y visitas para verificar su estado y garantizar su seguridad." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open1" position="-2 -0.2 -7" rotation="20 10 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open1; imageId: psico; closeId: close2" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="psico" position="-4 0.5 -12" rotation="0.000 20 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close2" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.5 0.01" value="Área de psicología" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.2 0.01" value="La violencia reiterada afecta emocionalmente a las mujeres, generando baja autoestima, estrés y, en algunos casos, tendencias suicidas, por lo que es fundamental el tratamiento psicológico. En el Centro, psicólogas especializadas brindan terapia individual a las víctimas y a sus hijos, ayudando a prevenir la repetición de patrones de violencia." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open2" position="-8 -0.2 -4" rotation="20 40 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open2; imageId: juridica; closeId: close3" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="juridica" position="-10 0.5 -5" rotation="0.000 70 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close3" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Área jurídica" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.7 0.01" value="Un equipo de abogados especialistas en materia de derecho familiar, gratuitamente ofrecen servicios jurídicos a las mujeres que sufren violencia.\n\nSus servicios incluyen trámites de:\n- Divorcios\n- Pensiones Alimenticias\n- Custodia de menores\n- Entre otros." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open3" position="-10 -0.2 2" rotation="20 90 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open3; imageId: ministerio; closeId: close4" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="ministerio" position="-10 0.5 5" rotation="0.000 120 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close4" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Área de ministerio público especializado" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="Los delitos de género contra mujeres son investigados por un equipo especializado de Ministerios Públicos, médicos legistas, policías y psicólogas. Su prioridad es garantizar la seguridad de las víctimas y sus hijos mediante un Protocolo de Medidas de Protección, que asegura su derecho a una vida libre de violencia, incluyendo restricciones para el agresor, desde advertencias hasta su desalojo del domicilio." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open4" position="-3 -0.2 6" rotation="20 150 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open4; imageId: bolsaTrabajo; closeId: close5" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="bolsaTrabajo" position="-1 0.5 10" rotation="0.000 170 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close5" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Bolsa de trabajo" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="Para las víctimas de violencia, la independencia económica es clave para romper el vínculo con el agresor. Por ello, los Centros de Justicia ofrecen una bolsa de trabajo con oportunidades acordes a su perfil y capacitación mediante cursos y talleres. Para más información sobre vacantes y formación, se les invita a acudir al Centro de Justicia para las Mujeres." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open5" position="5 -0.2 6" rotation="20 50 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open5; imageId: salud; closeId: close6" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="salud" position="8 0.5 5" rotation="0.000 240 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close6" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Área de salud" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="Cuando una mujer requiere atención médica de urgencia, es atendida por personal del sector de 
                    salud que se encuentra físicamente en nuestras instalaciones, quien le proporciona las primeras 
                    atenciones." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open6" position="10 -0.2 -2" rotation="20 90 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open6; imageId: empoderamiento; closeId: close7" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="empoderamiento" position="11 0.5 -4" rotation="0.000 290 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close7" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Empoderamiento" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="El Centro de Justicia para Mujeres ofrece un área de empoderamiento económico que brinda asesoría, seguimiento y acceso a proyectos productivos, empleo, cursos y capacitaciones. Estos apoyos, vinculados a programas de diversas instituciones, buscan promover la igualdad de género, erradicar la pobreza y fortalecer la autonomía económica de las mujeres." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open7" position="1 4 -7" rotation="20 180 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open7; imageId: ludica; closeId: close8" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="ludica" position="1 5.5 -10" rotation="0.000 10 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: black; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close8" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Área ludica" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="El Área Lúdica del Centro de Justicia de la Mujer (CJM) ofrece un espacio seguro para que los hijos de las usuarias permanezcan mientras ellas reciben atención. A través de actividades de juego, psicólogas y especialistas en educación pueden detectar posibles afectaciones por violencia y determinar si necesitan atención especializada." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>
            </a-entity>

            <a-entity id="group-point2" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point1;spotgroup:group-point1" position="0.5 0.5 4" rotation="90 60 140" src="#atras" material="opacity=0.8" geometry="width:2; height: 1.3" look-at="#cam"></a-image>
                <a-image class="adelante" spot="linkto:#point3;spotgroup:group-point3" position="-3.5 0.5 -2" rotation="90 60 -105" src="#adelante" material="opacity:0.8" geometry="width:2; height:1.3" look-at="#cam"></a-image>

                <a-video id="open8" position="-1 -0.5 -10" rotation="20 180 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open8; imageId: psicologica; closeId: close9" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="psicologica" position="-1 1 -10" rotation="0.000 10 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: #FFF200; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close9" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Violencia psicológica" align="center" color="black" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.4 0.01" value="Es cualquier acto u omisión que dañe la estabilidad psicológica, que puede consistir en: negligencia, abandono, descuido reiterado, celotipia, insultos, humillaciones, devaluación, marginación, indiferencia, infidelidad, comparaciones destructivas, rechazo, restricción a la autodeterminación y amenazas, las cuales conllevan a la víctima a la depresión, al aislamiento, a la devaluación de su autoestima e incluso al suicidio." align="center" color="black" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open9" position="5 -0.5 -7" rotation="20 140 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open9; imageId: fisica; closeId: close10" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="fisica" position="8.5 1 -8" rotation="0.000 -40 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 5" material="color: #FFA500; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 2.7 0.03" id="close10" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 1.8 0.01" value="Violencia física" align="center" color="black" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 0.8 0.01" value="Es cualquier acto que inflige daño no accidental, usando la fuerza física o algún tipo de arma u objeto que pueda provocar o no lesiones ya sean internas, externas, o ambas" align="center" color="black" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open10" position="9 -0.5 3" rotation="20 70 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open10; imageId: patrimonial; closeId: close11" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="patrimonial" position="10 1 2" rotation="0.000 -90 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 6.5" material="color: #FF7F00; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3.3 0.03" id="close11" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.7 0.01" value="Violencia patrimonial" align="center" color="black" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.4 0.01" value="Es cualquier acto u omisión que afecta la supervivencia de la víctima. Se manifiesta en: la transformación, sustracción, destrucción, retención o distracción de objetos, documentos personales, bienes y valores, derechos patrimoniales o recursos económicos destinados a satisfacer sus necesidades y puede abarcar los daños a los bienes comunes o propios de la víctima." align="center" color="black" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open11" position="1 3 7" rotation="20 10 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open11; imageId: economica; closeId: close12" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="economica" position="1 3 9" rotation="0.000 -170 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 5.5" material="color: #E63946; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3 0.03" id="close12" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.2 0.01" value="Violencia económica" align="center" color="black" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="Es toda acción u omisión del Agresor que afecta la supervivencia económica de la víctima. Se manifiesta a través de limitaciones encaminadas a controlar el ingreso de sus percepciones económicas, así como la percepción de un salario menor por igual trabajo, dentro de un mismo centro laboral" align="center" color="black" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>

                <a-video id="open12" position="-7 -0.5 5" rotation="20 -30 0.000" src="#video" material="opacity:0.8" visible="true" visibilidad="openImageId: open12; imageId: sexual; closeId: close13" geometry="width: 2.5; height: 2.5"></a-video>
                <a-entity id="sexual" position="-9 1 6" rotation="0.000 120 0.000" visible="false">
                    <a-plane position="0 1 0" rotation="0 0 0" geometry="width: 10; height: 5.5" material="color: #B30000; opacity: 0.7"></a-plane>
                    <a-circle position="4.2 3 0.03" id="close13" radius="0.4" material="src: #close1; opacity:1" geometry=""></a-circle>
                    <a-text position="0 2.2 0.01" value="Violencia sexual" align="center" color="white" width="9.5" text="wrapCount: 30; baseline: top; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                    <a-text position="0 1.1 0.01" value="Es cualquier acto que degrada o daña el cuerpo y/o la sexualidad de la Víctima y que por tanto atenta contra su libertad, dignidad e integridad física. Es una expresión de abuso de poder que implica la supremacía masculina sobre la mujer, al denigrarla y concebirla como objeto." align="center" color="white" width="9.5" text="wrapCount: 50; baseline: top; shader: msdf; negate: false;" font="https://raw.githubusercontent.com/mel091/lato-font/refs/heads/main/Lato-Regular-msdf.json"></a-text>
                </a-entity>
            </a-entity>

            <a-entity id="group-point3" scale="0 0 0">
                <a-image class="atras" spot="linkto:#point2;spotgroup:group-point2" position="0.5 -0.9 3" rotation="90 60 142" src="#atras" material="opacity:0.8" geometry="width:1.8; height: 1.3" look-at="#cam"></a-image>
